<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="전파법규 100">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>전파법규 예상문제 100</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#636b7a; --line:#e2e5ea;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --on-accent:#ffffff;
  --ok:#1f8a4c; --ok-soft:#e5f4ea; --bad:#c43c3c; --bad-soft:#fbe9e9;
  --chip:#eef0f4; --shadow:0 1px 2px rgba(0,0,0,.05);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171c; --card:#1d2128; --text:#e9ebef; --muted:#9aa2b1; --line:#2c323c;
    --accent:#7c9cff; --accent-soft:#232c45; --on-accent:#0e1220;
    --ok:#57c785; --ok-soft:#1b3326; --bad:#ff7b7b; --bad-soft:#3a2224;
    --chip:#262b34; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.55}
button,select{font:inherit;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;
  padding:0 calc(16px + var(--safe-r)) calc(24px + var(--safe-b)) calc(16px + var(--safe-l))}
body.single .wrap{padding-bottom:calc(96px + var(--safe-b))}

/* 상단 고정 바 */
.top{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(10px + var(--safe-t)) 0 10px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;gap:10px}
h1{font-size:1.12rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  min-height:40px;padding:0 12px;font-size:.88rem;cursor:pointer}
.stats{display:flex;gap:12px;font-size:.86rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.stats b{color:var(--text)}
.stats .ok b{color:var(--ok)} .stats .bad b{color:var(--bad)}
.bar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin:0 calc(-16px - var(--safe-r)) 0 calc(-16px - var(--safe-l));padding:0 calc(16px + var(--safe-r)) 2px calc(16px + var(--safe-l))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
  min-height:38px;padding:0 14px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
select.sec{width:100%;margin-top:8px;min-height:42px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:0 12px;font-size:16px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}

/* 문제 카드 */
.sec-title{margin:22px 2px 6px;font-size:.92rem;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.q{font-weight:650;font-size:1.04rem;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.q .num{color:var(--accent);margin-right:4px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:transparent;color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  font-size:1rem;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.opt:active:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}}
.opt:disabled{cursor:default;opacity:1}
.opt .m{flex:none;font-weight:700;width:1.3em}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:.94rem;word-break:keep-all;overflow-wrap:anywhere}
.exp.show{display:block}
.verdict{display:block;font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ref{display:block;margin-top:6px;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:48px 0}

/* 한 문제씩 모드 하단 바 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:10px calc(16px + var(--safe-r)) calc(10px + var(--safe-b)) calc(16px + var(--safe-l));display:none}
body.single .nav{display:block}
.nav-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nav button:disabled{opacity:.4}
.nav .pos{flex:none;min-width:70px;text-align:center;font-size:.9rem;color:var(--muted)}

/* 숫자 모음 */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:18px 0}
summary{cursor:pointer;font-weight:650;min-height:28px}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
td{border-top:1px solid var(--line);padding:9px 4px;vertical-align:top;word-break:keep-all}
td:last-child{font-weight:650;text-align:right;padding-left:10px}
.note{font-size:.8rem;color:var(--muted);margin:18px 2px}
@media print{.top,.nav{display:none}.exp{display:block}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="title-row">
      <h1>전파법규 예상문제 100</h1>
      <button class="icon-btn" id="viewBtn">목록으로</button>
    </div>
    <div class="stats">
      <span>푼 문제 <b id="sDone">0</b>/<span id="sTotal">100</span></span>
      <span class="ok">정답 <b id="sOk">0</b></span>
      <span class="bad">오답 <b id="sBad">0</b></span>
      <span>정답률 <b id="sRate">-</b></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="chips">
      <button class="chip on" data-mode="all">전체</button>
      <button class="chip" data-mode="todo">안 푼 문제</button>
      <button class="chip" data-mode="wrong">틀린 문제</button>
      <button class="chip" id="shuffleBtn">순서 섞기</button>
      <button class="chip" id="numsBtn">숫자 모음</button>
      <button class="chip" id="resetBtn">기록 초기화</button>
    </div>
    <select class="sec" id="secSel" aria-label="영역 선택"><option value="">전체 영역 (11개)</option></select>
  </div>
</div>

<div class="wrap">
  <main id="list"></main>

  <details id="numsBox">
    <summary>꼭 외울 숫자 모음</summary>
    <table id="numTbl"></table>
  </details>

  <p class="note">현행 「전파법」(2026.10.22 시행)·「전파법 시행령」(2026.10.20 개정) 조문으로 만든 예상문제입니다. 기출이 아니며 ITU 전파규칙·무선설비규칙은 포함하지 않았습니다. 합격 기준(면제교육 이수 시): 전파법규 20문항 중 12문항(60점) 이상. 풀이 기록은 이 기기의 브라우저에만 저장됩니다.</p>
</div>

<nav class="nav" aria-label="문제 이동">
  <div class="nav-in">
    <button id="prevBtn">이전</button>
    <span class="pos" id="pos">1 / 100</span>
    <button id="nextBtn" class="primary">다음</button>
  </div>
</nav>

<script>

, "sec": "목적과 정의", "q": "\"무선국\"에서 제외되는 것은?", "opts": ["수신전용 무선국", "실험국", "방송수신만을 목적으로 하는 것", "아마추어국"], "a": 2, "exp": "방송수신만을 목적으로 하는 것은 무선국에서 제외", "ref": "법 제2조①6"}, {"n": 11, "sec": "목적과 정의", "q": "\"시설자\"의 정의로 옳은 것은?", "opts": ["무선설비를 제작한 자", "과학기술정보통신부장관으로부터 무선국의 개설허가를 받거나 개설신고를 하고 무선국을 개설한 자", "무선설비를 조작하는 무선종사자", "무선설비를 판매하는 자"], "a": 1, "exp": "허가를 받거나 신고를 하고 무선국을 개설한 자", "ref": "법 제2조①8"}, {"n": 12, "sec": "목적과 정의", "q": "\"우주국과 통신을 하기 위하여 지구에 개설한 무선국\"은?", "opts": ["우주국", "지구국", "위성망", "기지국"], "a": 1, "exp": "우주국은 인공위성에 개설한 무선국", "ref": "법 제2조①10·11"}, {"n": 13, "sec": "목적과 정의", "q": "\"위성망\"의 정의로 옳은 것은?", "opts": ["인공위성에 개설한 무선국", "우주국의 위치나 궤적", "우주국과 지구국으로 구성된 통신망의 총체", "위성방송을 수신하는 설비"], "a": 2, "exp": "위성주파수와 위성궤도 포함", "ref": "법 제2조①12"}, {"n": 14, "sec": "목적과 정의", "q": "전자파장해 정의에서 \"전자파에너지가 전원선을 통하여 흐르는 것\"을 뜻하는 용어는?", "opts": ["방사", "전도", "유도", "반사"], "a": 1, "exp": "방사 = 공간으로 퍼짐, 전도 = 전원선을 통해 흐름", "ref": "법 제2조①14"}, {"n": 15, "sec": "목적과 정의", "q": "\"무선종사자\"의 정의로 옳은 것은?", "opts": ["무선국을 개설한 자", "무선설비를 조작하거나 설치공사를 하는 사람으로서 기술자격증을 발급받은 사람", "무선설비를 이용하는 모든 사람", "무선국에서 근무하는 모든 직원"], "a": 1, "exp": "제70조②에 따라 기술자격증을 발급받은 사람", "ref": "법 제2조①7"}, {"n": 16, "sec": "무선국 개설·허가·신고", "q": "무선국을 개설하려는 자는 원칙적으로 누구의 허가를 받아야 하는가?", "opts": ["국무총리", "과학기술정보통신부장관", "한국방송통신전파진흥원장", "시·도지사"], "a": 1, "exp": "과학기술정보통신부장관의 허가", "ref": "법 제19조①"}, {"n": 17, "sec": "무선국 개설·허가·신고", "q": "신고를 통하여 개설할 수 있는 무선국(법 제19조의2제1항)에 해당하지 않는 것은?", "opts": ["발사하는 전파가 미약한 무선국", "수신전용의 무선국", "이동멀티미디어방송을 위하여 개설하는 무선국", "실험국"], "a": 3, "exp": "신고 대상: 미약/설치공사 불요, 수신전용, 주파수할당 받은 자의 전기통신역무용, 이동멀티미디어방송", "ref": "법 제19조의2①"}, {"n": 18, "sec": "무선국 개설·허가·신고", "q": "신고하지 아니하고 개설할 수 있는 무선국은?", "opts": ["발사하는 전파가 미약한 무선국 등으로서 대통령령으로 정하는 무선국", "방송국", "해안국", "항공국"], "a": 0, "exp": "미약한 무선국 등 대통령령으로 정하는 무선국", "ref": "법 제19조의2②"}, {"n": 19, "sec": "무선국 개설·허가·신고", "q": "전파법을 위반하여 금고 이상의 실형을 선고받은 자는 그 집행이 끝나거나 집행을 받지 아니하기로 확정된 날부터 몇 년이 지나야 무선국을 개설할 수 있는가?", "opts": ["1년", "2년", "3년", "5년"], "a": 2, "exp": "3년", "ref": "법 제20조①4"}, {"n": 20, "sec": "무선국 개설·허가·신고", "q": "무선국 개설의 결격사유에 해당하지 않는 것은?", "opts": ["대한민국의 국적을 가지지 아니한 자", "외국정부 또는 그 대표자", "외국의 법인 또는 단체", "전파법을 위반하여 벌금형을 선고받은 자"], "a": 3, "exp": "결격사유는 \"금고 이상\"의 형. 벌금형은 해당 없음", "ref": "법 제20조①"}, {"n": 21, "sec": "무선국 개설·허가·신고", "q": "외국인 등 결격사유(법 제20조제1항제1~3호)가 적용되지 않는 무선국이 아닌 것은?", "opts": ["실험국", "「선박안전법」 등에 따른 선박의 무선국", "국내에서 열리는 국제적 행사를 위하여 그 기간에만 허용하는 무선국", "지상파방송국"], "a": 3, "exp": "실험국, 선박 무선국, 국제·국가 행사 기간 무선국 등은 예외. 방송국은 예외 목록에 없음", "ref": "법 제20조②"}, {"n": 22, "sec": "무선국 개설·허가·신고", "q": "\"과학이나 기술발전을 위한 실험에만 사용하는 무선국\"은?", "opts": ["실험국", "아마추어국", "비상국", "고정국"], "a": 0, "exp": "실험국", "ref": "법 제20조②1"}, {"n": 23, "sec": "무선국 개설·허가·신고", "q": "\"개인적으로 무선기술에 흥미를 가지고 자기훈련과 기술연구에만 사용하는 무선국\"은?", "opts": ["실험국", "아마추어국", "간이무선국", "육상국"], "a": 1, "exp": "아마추어국", "ref": "법 제20조②4나"}, {"n": 24, "sec": "무선국 개설·허가·신고", "q": "무선국의 개설조건(법 제20조의2)으로 옳지 않은 것은?", "opts": ["통신사항이 개설목적에 적합할 것", "개설목적 달성에 필요한 최대한의 주파수 및 안테나공급전력을 사용할 것", "이미 개설되어 있는 다른 무선국의 운용에 지장을 주지 아니할 것", "개설목적·통신사항 및 통신상대방의 선정이 법령에 위반되지 아니할 것"], "a": 1, "exp": "\"최소한\"의 주파수 및 안테나공급전력", "ref": "법 제20조의2①4"}, {"n": 25, "sec": "무선국 개설·허가·신고", "q": "개설조건상 무선설비는 무엇에 지장을 주지 아니하는 장소에 설치하여야 하는가?", "opts": ["인명·재산 및 항공의 안전", "방송수신", "도시 미관", "주변 상권"], "a": 0, "exp": "인명·재산 및 항공의 안전", "ref": "법 제20조의2①5"}, {"n": 26, "sec": "무선국 개설·허가·신고", "q": "무선국 개설허가 신청 시 과학기술정보통신부장관의 심사사항이 아닌 것은?", "opts": ["주파수지정이 가능한지 여부", "무선설비가 기술기준에 적합한지 여부", "무선종사자 배치계획이 자격·정원배치기준에 적합한지 여부", "신청인의 재무상태가 건전한지 여부"], "a": 3, "exp": "심사: 주파수지정 가능 여부, 기술기준, 무선종사자 배치계획, 개설조건", "ref": "법 제21조②"}, {"n": 27, "sec": "무선국 개설·허가·신고", "q": "개설허가 시 발급하는 허가증에 반드시 적어야 하는 것은?", "opts": ["무선국의 준공기한", "시설자의 학력", "무선설비의 구입가격", "무선종사자의 경력"], "a": 0, "exp": "준공기한과 대통령령으로 정하는 사항", "ref": "법 제21조④"}, {"n": 28, "sec": "무선국 개설·허가·신고", "q": "전기통신역무를 제공받기 위한 무선국으로서 대통령령으로 정하는 무선국은 무엇을 한 때 허가를 받은 것으로 보는가?", "opts": ["무선설비를 구입한 때", "전기통신역무를 제공하는 자와 이용계약을 체결한 때", "준공신고를 한 때", "전파사용료를 낸 때"], "a": 1, "exp": "이용계약 체결 시 허가받은 것으로 봄 (예: 휴대전화)", "ref": "법 제19조②"}, {"n": 29, "sec": "무선국 개설·허가·신고", "q": "준공기한 연장 시 총 연장기간은 얼마를 초과할 수 없는가?", "opts": ["3개월", "6개월", "1년", "2년"], "a": 2, "exp": "총 연장기간 1년 초과 불가", "ref": "법 제24조③"}, {"n": 30, "sec": "무선국 개설·허가·신고", "q": "허가증에 적힌 준공기한(연장한 경우 그 기한)이 지난 후 며칠이 지날 때까지 준공신고를 마치지 아니하면 무선국 처분 사유가 되는가?", "opts": ["7일", "15일", "30일", "60일"], "a": 2, "exp": "준공기한 경과 후 30일", "ref": "법 제72조②3"}, {"n": 31, "sec": "유효기간과 재허가", "q": "법률상 무선국 개설허가의 유효기간은 몇 년 이내의 범위에서 대통령령으로 정하는가?", "opts": ["3년", "5년", "7년", "10년"], "a": 2, "exp": "개설허가 7년 이내 (주파수 사용승인은 10년 이내)", "ref": "법 제22조①"}, {"n": 32, "sec": "유효기간과 재허가", "q": "의무선박국과 의무항공기국의 개설허가 유효기간은?", "opts": ["1년", "5년", "7년", "무기한"], "a": 3, "exp": "의무선박국·의무항공기국은 무기한", "ref": "법 제22조②"}, {"n": 33, "sec": "유효기간과 재허가", "q": "실험국의 개설허가 유효기간은?", "opts": ["1년", "3년", "5년", "7년"], "a": 0, "exp": "실험국 및 실용화시험국 1년", "ref": "시행령 제36조①1"}, {"n": 34, "sec": "유효기간과 재허가", "q": "아마추어국·기지국·육상이동국·해안국의 개설허가 유효기간은?", "opts": ["1년", "3년", "5년", "7년"], "a": 2, "exp": "5년", "ref": "시행령 제36조①2"}, {"n": 35, "sec": "유효기간과 재허가", "q": "위성방송국의 개설허가 유효기간은?", "opts": ["3년", "5년", "7년", "10년"], "a": 2, "exp": "방송국 5년, 위성방송국·위성방송보조국 7년", "ref": "시행령 제36조①2의2"}, {"n": 36, "sec": "유효기간과 재허가", "q": "무선국 개설허가의 유효기간은 원칙적으로 언제부터 기산하는가?", "opts": ["허가 신청일", "허가증 발급일", "검사증명서를 발급받은 날", "준공신고일"], "a": 2, "exp": "검사증명서를 발급받은 날 (준공검사 면제 무선국은 허가받은 날)", "ref": "법 제22조③2"}, {"n": 37, "sec": "유효기간과 재허가", "q": "재허가를 받으려는 자는 유효기간 만료 전 언제 신청하여야 하는가? (유효기간 1년 초과 무선국)", "opts": ["1개월 이상 2개월 이내", "2개월 이상 4개월 이내", "3개월 이상 6개월 이내", "6개월 이상 1년 이내"], "a": 1, "exp": "2개월 이상 4개월 이내 (유효기간 1년이면 2개월 전까지)", "ref": "시행령 제38조①"}, {"n": 38, "sec": "유효기간과 재허가", "q": "과학기술정보통신부장관은 개설허가 유효기간이 끝나는 날의 언제까지 시설자에게 재허가 절차를 미리 알려야 하는가?", "opts": ["1개월 전", "2개월 전", "4개월 전", "1년 전"], "a": 2, "exp": "4개월 전까지 (주파수 사용승인 재승인은 1년 전까지)", "ref": "시행령 제36조⑤"}, {"n": 39, "sec": "시설자의 지위승계", "q": "시설자의 지위를 승계하는 자가 아닌 것은?", "opts": ["사업을 양도하면서 무선국을 양도한 경우의 양수인", "합병 후 존속하는 법인", "시설자가 사망한 경우의 상속인", "무선국에 새로 배치된 무선종사자"], "a": 3, "exp": "양수인, 합병법인, 상속인, 선박·항공기 운항자 변경", "ref": "법 제23조①"}, {"n": 40, "sec": "시설자의 지위승계", "q": "시설자가 사망하여 상속인이 지위를 승계하는 경우 필요한 절차는?", "opts": ["과학기술정보통신부장관의 인가", "과학기술정보통신부장관에게 신고", "법원의 허가", "별도 절차 없음"], "a": 1, "exp": "상속·선박/항공기 운항자 변경 = 신고, 양수·합병 = 인가", "ref": "법 제23조②③"}, {"n": 41, "sec": "시설자의 지위승계", "q": "양수·합병에 따른 지위승계 인가 신청을 받은 과학기술정보통신부장관은 며칠 이내에 인가 여부를 통지하여야 하는가?", "opts": ["7일", "10일", "14일", "30일"], "a": 0, "exp": "7일 이내 (통지 없으면 기간 끝난 다음 날 인가 간주)", "ref": "법 제23조④⑤"}, {"n": 42, "sec": "시설자의 지위승계", "q": "합병이나 상속으로 지위를 승계한 자가 2명 이상인 경우 해야 할 일은?", "opts": ["무선국을 폐지", "그중 1명을 대표자로 선정", "무선국을 분할", "재허가 신청"], "a": 1, "exp": "1명을 대표자로 선정", "ref": "법 제23조⑦"}, {"n": 43, "sec": "검사", "q": "준공검사에서 확인하는 사항은?", "opts": ["무선설비의 가격과 제조사", "기술기준 및 무선종사자의 자격·정원배치기준 적합 여부", "시설자의 신용도", "통신 내용의 적법성"], "a": 1, "exp": "기술기준 및 무선종사자의 자격·정원배치기준", "ref": "법 제24조①"}, {"n": 44, "sec": "검사", "q": "정기검사는 몇 년의 범위에서 무선국별로 대통령령으로 정하는 기간마다 실시하는가?", "opts": ["1년", "3년", "5년", "7년"], "a": 2, "exp": "5년의 범위", "ref": "법 제24조⑤"}, {"n": 45, "sec": "검사", "q": "정기검사 유효기간이 1년인 무선국은?", "opts": ["아마추어국", "실험국", "기지국", "방송국"], "a": 1, "exp": "1년: 의무선박국·의무항공기국·실험국·실용화시험국", "ref": "시행령 제44조①1"}, {"n": 46, "sec": "검사", "q": "총톤수 40톤 미만인 어선의 의무선박국의 정기검사 유효기간은?", "opts": ["1년", "2년", "3년", "5년"], "a": 1, "exp": "2년", "ref": "시행령 제44조①2가"}, {"n": 47, "sec": "검사", "q": "정기검사 유효기간이 5년인 무선국의 정기검사 시기는?", "opts": ["만료일 전후 1개월 이내", "만료일 전후 2개월 이내", "만료일 전후 3개월 이내", "만료일 전후 6개월 이내"], "a": 3, "exp": "전후 6개월 이내", "ref": "시행령 제45조①3"}, {"n": 48, "sec": "검사", "q": "정기검사 유효기간이 1년인 무선국(실험국 등)의 정기검사 시기는?", "opts": ["만료일 전후 1개월 이내", "만료일 전후 2개월 이내", "만료일 전후 3개월 이내", "만료일 전후 6개월 이내"], "a": 1, "exp": "전후 2개월 이내", "ref": "시행령 제45조①1"}, {"n": 49, "sec": "검사", "q": "준공검사 결과 부적합한 무선국은 언제까지 재검사를 받아야 하는가?", "opts": ["결과 통보일부터 1개월 이내", "3개월 이내", "6개월 이내", "1년 이내"], "a": 2, "exp": "결과를 통보받은 날부터 6개월 이내 (2026.10.20 개정)", "ref": "시행령 제43조의2"}, {"n": 50, "sec": "검사", "q": "시설자·무선설비·설치장소 및 무선종사자의 배치 const MARKS = ["①","②","③","④"];
const ROMAN = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ","Ⅺ"];
const KEY = "jeonpa_quiz_v2";
const BASE = DATA.qs.map(q => q.n);
const byN = Object.fromEntries(DATA.qs.map(q => [q.n, q]));
let state = {}, order = BASE.slice(), mode = "all", sec = "", view = "single", idx = 0;

function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    state = s.state || {};
    if (Array.isArray(s.order) && s.order.length === BASE.length) order = s.order;
    if (s.view) view = s.view; else view = window.matchMedia("(min-width: 760px)").matches ? "list" : "single";
    if (typeof s.idx === "number") idx = s.idx;
  } catch(e) { view = "single"; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({state, order, view, idx})); } catch(e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isShuffled = () => order.join(",") !== BASE.join(",");

function items(){
  let it = order.map(n => byN[n]).filter(q => !sec || q.sec === sec);
  if (mode === "todo") it = it.filter(q => !(q.n in state));
  if (mode === "wrong") it = it.filter(q => (q.n in state) && state[q.n] !== q.a);
  return it;
}

function stats(){
  const nums = DATA.qs.filter(q => !sec || q.sec === sec).map(q => q.n);
  let done = 0, ok = 0;
  for (const n of nums) if (n in state){ done++; if (state[n] === byN[n].a) ok++; }
  sDone.textContent = done; sTotal.textContent = nums.length;
  sOk.textContent = ok; sBad.textContent = done - ok;
  const rate = done ? Math.round(ok / done * 100) : null;
  sRate.textContent = rate === null ? "-" : rate + "%";
  sRate.style.color = rate === null ? "" : (rate >= 60 ? "var(--ok)" : "var(--bad)");
  bar.style.width = (nums.length ? done / nums.length * 100 : 0) + "%";
}

function cardHTML(q){
  const chosen = state[q.n], answered = chosen !== undefined, ok = answered && chosen === q.a;
  const opts = q.opts.map((o, i) => {
    let c = "opt";
    if (answered){ if (i === q.a) c += " correct"; else if (i === chosen) c += " wrong"; }
    return `<button class="${c}" data-n="${q.n}" data-i="${i}" ${answered ? "disabled" : ""}><span class="m">${MARKS[i]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  const si = DATA.sections.indexOf(q.sec);
  return `<article class="card" id="q${q.n}">
    <div class="meta"><span>${ROMAN[si]}. ${esc(q.sec)}</span><span>${q.n}번</span></div>
    <div class="q"><span class="num">${q.n}.</span>${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    <div class="exp ${answered ? "show" : ""}">
      ${answered ? `<span class="verdict ${ok ? "ok" : "bad"}">${ok ? "정답입니다" : "오답 · 정답은 " + MARKS[q.a]}</span>` : ""}
      ${esc(q.exp)}<span class="ref">근거: ${esc(q.ref)}</span>
    </div>
  </article>`;
}

function emptyMsg(){ return `<p class="empty">${mode === "wrong" ? "틀린 문제가 없습니다 👍" : mode === "todo" ? "모두 풀었습니다" : "문제가 없습니다"}</p>`; }

function render(scrollTop){
  document.body.classList.toggle("single", view === "single");
  viewBtn.textContent = view === "single" ? "목록으로" : "한 문제씩";
  const it = items();
  if (!it.length){ list.innerHTML = emptyMsg(); pos.textContent = "0 / 0"; prevBtn.disabled = nextBtn.disabled = true; stats(); return; }
  if (view === "single"){
    if (idx >= it.length) idx = it.length - 1;
    if (idx < 0) idx = 0;
    list.innerHTML = cardHTML(it[idx]);
    pos.textContent = `${idx + 1} / ${it.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === it.length - 1;
    nextBtn.textContent = idx === it.length - 1 ? "마지막" : "다음";
  } else {
    let html = "", last = null;
    for (const q of it){
      if (!isShuffled() && q.sec !== last){ html += `<h2 class="sec-title">${ROMAN[DATA.sections.indexOf(q.sec)]}. ${esc(q.sec)}</h2>`; last = q.sec; }
      html += cardHTML(q);
    }
    list.innerHTML = html;
  }
  stats();
  if (scrollTop) window.scrollTo({top: 0});
}

list.addEventListener("click", e => {
  const b = e.target.closest(".opt"); if (!b || b.disabled) return;
  const n = +b.dataset.n; state[n] = +b.dataset.i; save();
  if (view === "single" && mode !== "all"){
    // 필터 모드에서는 답한 문제가 목록에서 빠질 수 있으므로 현재 카드만 갱신
    document.getElementById("q" + n).outerHTML = cardHTML(byN[n]); stats();
  } else {
    document.getElementById("q" + n).outerHTML = cardHTML(byN[n]); stats();
  }
  if (navigator.vibrate) navigator.vibrate(state[n] === byN[n].a ? 15 : [20, 40, 20]);
});

function go(d){ idx += d; save(); render(true); }
prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);

document.querySelectorAll(".chip[data-mode]").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; idx = 0;
  document.querySelectorAll(".chip[data-mode]").forEach(x => x.classList.toggle("on", x === b));
  save(); render(true);
}));
secSel.onchange = e => { sec = e.target.value; idx = 0; save(); render(true); };
viewBtn.onclick = () => { view = view === "single" ? "list" : "single"; save(); render(true); };
shuffleBtn.onclick = () => {
  if (isShuffled()) order = BASE.slice();
  else { order = BASE.slice(); for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } }
  idx = 0; syncShuffle(); save(); render(true);
};
function syncShuffle(){ shuffleBtn.classList.toggle("on", isShuffled()); shuffleBtn.textContent = isShuffled() ? "번호순으로" : "순서 섞기"; }
numsBtn.onclick = () => { numsBox.open = true; numsBox.scrollIntoView({behavior:"smooth"}); };
resetBtn.onclick = () => {
  if (!confirm("풀이 기록을 모두 지울까요?")) return;
  state = {}; order = BASE.slice(); idx = 0; syncShuffle(); save(); render(true);
};

// 좌우 스와이프로 이동 (한 문제씩 모드)
let sx = 0, sy = 0, st = 0;
list.addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, {passive:true});
list.addEventListener("touchend", e => {
  if (view !== "single") return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    const max = items().length - 1;
    if (dx < 0 && idx < max) go(1); else if (dx > 0 && idx > 0) go(-1);
  }
}, {passive:true});

DATA.sections.forEach((s, i) => { const o = document.createElement("option"); o.value = s; o.textContent = `${ROMAN[i]}. ${s}`; secSel.appendChild(o); });
numTbl.innerHTML = DATA.nums.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("");
load(); syncShuffle(); render(false);
</script>
</body>
</html>
